   let add = document.querySelector('#Add')

   let  count  = Number(localStorage.getItem("count")) || 0;

   function Display_container(){
    document.querySelector('.Display_container').innerText =count
   }
   // Show saved count when page loads
    Display_container();


   // click functionality used in Add button
   add.addEventListener('click', Addfun )
   function Addfun(){
    count = count +1  
    localStorage.setItem("count" , count)
    Display_container()
   }


 // As same as the sub Button 
  sub.addEventListener('click' , Subfun)
  function Subfun(){
    count = count -1
    localStorage.setItem("count" , count)

  function Test_case1(){
